services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - ./app/.env
    volumes:
      - ./app/src:/app
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: on-failure
    networks:
      - backend

  web-proxy:
    build:
      context: ./web-proxy
      dockerfile: Dockerfile
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: on-failure
    networks:
      - backend

  database:
    image: postgres:16
    env_file:
      - ./database.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  backend:
    driver: bridge

volumes:
  rabbitmq_data:
  pg_data: