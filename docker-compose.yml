services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - ./app/.env
    volumes:
      - ./app/src:/app
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend
    ports:
      - "8000:8000"
  
  web-proxy:
    build:
      context: ./web-proxy
      dockerfile: Dockerfile
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    restart: on-failure
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-guest}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - backend

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: "${DB_NAME:-app_db}"
      POSTGRES_USER: "${DB_USER:-app_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-app_pass}"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  rabbitmq_data:
  pg_data: