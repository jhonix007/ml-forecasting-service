services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  database:
    image: postgres:16
    env_file:
      - database.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./app/.env
    environment:
      LOG_LEVEL: INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: python -u ml_worker.py
    environment:
      PYTHONPATH: /opt/shared_app
      LOG_LEVEL: INFO
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: guest
      RABBIT_PASS: guest
      RABBIT_QUEUE: ml_tasks
      DB_URL: "postgresql+psycopg2://postgres:postgres@database:5432/postgres"
      HF_MODEL_ID: "huggingface/time-series-transformer-tourism-monthly"
      HF_DEVICE: "cpu"
    volumes:
      - ./app/src/app:/opt/shared_app/app:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - app

  web-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - web

volumes:
  rabbitmq_data:
  pg_data:
