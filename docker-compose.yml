services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  database:
    image: postgres:16
    env_file:
      - database.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./app/.env
    environment:
      LOG_LEVEL: INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: python -m workers.ml_worker
    env_file:
      - ./app/.env
    environment:
      LOG_LEVEL: INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy

  web-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  rabbitmq_data:
  pg_data:
